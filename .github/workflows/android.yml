name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Project and Fix Manifest
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -o "$ZIP_FILE"
        fi

        cd TurboSpaceOptimizer

        sed -i 's/package="com.turbospace.optimizer"//g' app/src/main/AndroidManifest.xml

        sed -i '/android:icon/d' app/src/main/AndroidManifest.xml
        sed -i '/android:roundIcon/d' app/src/main/AndroidManifest.xml

        if ! grep -q "android.suppressUnsupportedCompileSdk" gradle.properties; then
          echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
        fi

        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TurboSpace-Optimizer-APK
        path: '**/app/build/outputs/apk/debug/*.apk'

