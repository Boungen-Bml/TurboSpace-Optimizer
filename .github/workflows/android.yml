name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Project and Rewrite Build Gradle
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -o "$ZIP_FILE"
        fi

        cd TurboSpaceOptimizer

        find . -type f \( -name "*.kts" -o -name "*.properties" \) -exec sed -i 's/2.4.0/2.0.0/g' {} +

        if ! grep -q "org.gradle.jvmargs" gradle.properties; then
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> gradle.properties
        else
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8/g' gradle.properties
        fi

        sed -i 's/package="com.turbospace.optimizer"//g' app/src/main/AndroidManifest.xml 2>/dev/null || true
        sed -i '/android:icon/d' app/src/main/AndroidManifest.xml 2>/dev/null || true
        sed -i '/android:roundIcon/d' app/src/main/AndroidManifest.xml 2>/dev/null || true

        if ! grep -q "android.suppressUnsupportedCompileSdk" gradle.properties; then
          echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
        fi

        # Fix missing imports directly in MainActivity.kt
        sed -i '1i import androidx.lifecycle.ViewTreeLifecycleOwner\nimport androidx.lifecycle.ViewTreeViewModelStoreOwner\nimport androidx.savedstate.setViewTreeSavedStateRegistryOwner' app/src/main/java/com/turbospace/optimizer/MainActivity.kt 2>/dev/null || true

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.turbospace.optimizer"
            compileSdk = 35

            defaultConfig {
                applicationId = "com.turbospace.optimizer"
                minSdk = 26
                targetSdk = 35
                versionCode = 1
                versionName = "1.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            buildFeatures {
                compose = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.14"
            }
        }

        dependencies {
            implementation(platform("androidx.compose:compose-bom:2024.02.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.compose.ui:ui-tooling")
            implementation("androidx.compose.material3:material3")
            
            // Lifecycle, SavedState & ViewTree
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.lifecycle:lifecycle-service:2.7.0")
            implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")
            implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
            implementation("androidx.lifecycle:lifecycle-runtime-compose:2.7.0")
            implementation("androidx.savedstate:savedstate-ktx:1.2.1")
            implementation("androidx.activity:activity-compose:1.8.2")
            
            // Icons & Material
            implementation("androidx.compose.material:material-icons-core:1.6.0")
            implementation("androidx.compose.material:material-icons-extended:1.6.0")
            
            // Image Loading (Coil)
            implementation("io.coil-kt:coil:2.6.0")
            implementation("io.coil-kt:coil-compose:2.6.0")
            implementation("io.coil-kt:coil-gif:2.6.0")
            
            // Shizuku API
            implementation("dev.rikka.shizuku:api:13.1.5")
            implementation("dev.rikka.shizuku:provider:13.1.5")
        }
        EOF

        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TurboSpace-Optimizer-APK
        path: '**/app/build/outputs/apk/debug/*.apk'

