name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Project and Inject Fixes
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -o "$ZIP_FILE"
        fi

        cd TurboSpaceOptimizer

        find . -type f \( -name "*.kts" -o -name "*.properties" \) -exec sed -i 's/2.4.0/2.0.0/g' {} +

        if ! grep -q "org.gradle.jvmargs" gradle.properties; then
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> gradle.properties
        else
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8/g' gradle.properties
        fi

        sed -i 's/package="com.turbospace.optimizer"//g' app/src/main/AndroidManifest.xml 2>/dev/null || true
        sed -i '/android:icon/d' app/src/main/AndroidManifest.xml 2>/dev/null || true
        sed -i '/android:roundIcon/d' app/src/main/AndroidManifest.xml 2>/dev/null || true

        if ! grep -q "android.suppressUnsupportedCompileSdk" gradle.properties; then
          echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
        fi

        echo "" >> app/build.gradle.kts
        echo "dependencies {" >> app/build.gradle.kts
        echo "    implementation(\"androidx.lifecycle:lifecycle-runtime-ktx:2.7.0\")" >> app/build.gradle.kts
        echo "    implementation(\"androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0\")" >> app/build.gradle.kts
        echo "    implementation(\"androidx.activity:activity-compose:1.8.2\")" >> app/build.gradle.kts
        echo "    implementation(\"androidx.compose.material:material-icons-extended:1.6.0\")" >> app/build.gradle.kts
        echo "    implementation(\"dev.rikka.shizuku:api:13.1.5\")" >> app/build.gradle.kts
        echo "    implementation(\"dev.rikka.shizuku:provider:13.1.5\")" >> app/build.gradle.kts
        echo "}" >> app/build.gradle.kts

        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TurboSpace-Optimizer-APK
        path: '**/app/build/outputs/apk/debug/*.apk'

