name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Debug and Extract Zip
      run: |
        echo "=== Current Repository Files ==="
        ls -la
        
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found ZIP file: $ZIP_FILE"
          unzip -o "$ZIP_FILE"
        fi

        echo "=== All Extracted Files ==="
        find . -maxdepth 4

    - name: Find Gradlew and Build
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file not found anywhere!"
          exit 1
        fi

        chmod +x "$GRADLEW_PATH"
        BUILD_DIR=$(dirname "$GRADLEW_PATH")
        cd "$BUILD_DIR"
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TurboSpace-Optimizer-APK
        path: '**/app/build/outputs/apk/debug/*.apk'

